
name: Fibonacci API CI/CD

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Check Python syntax
        run: |
          uv run python -m py_compile main.py fibonacci.py monitor.py
          uv run python -m py_compile tests/test_fibonacci.py tests/test_api.py

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -v

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Bump project version
        run: |
          uv version --bump patch
          uv lock

      - name: Verify updated dependencies
        run: uv sync --locked

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Health Check
        id: health_check
        run: |
          exit 1  # TEMPORARY TEST
          
          HEALTH_URL="https://dev-ops-mid-term.vercel.app/health"
          
          for attempt in {1..10}; do
            echo "Health check attempt $attempt/10"
          
            if curl -fsS "$HEALTH_URL" | grep -q '"status":"healthy"'; then
              echo "Health check passed!"
              exit 0
            fi
          
            echo "Health check failed. Retrying in 5 seconds..."
            sleep 5
          done
          
          echo "Health check failed after 10 attempts."
          exit 1

      - name: Prepare Vercel Project
        if: always() && steps.health_check.outcome == 'failure'
        run: |
          rm -rf .vercel
          echo "Removed stale Vercel configuration."

      - name: Automatic Rollback
        id: rollback
        if: failure() && steps.health_check.outcome == 'failure'
        run: |
          echo "Health check failed. Rolling back..."
        
          vercel rollback --timeout 0 --token="$VERCEL_TOKEN"
          
          echo "Rollback command executed."
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Verify Rollback
        if: failure() && steps.health_check.outcome == 'failure' && steps.rollback.outcome == 'success'
        run: |
          echo "Verifying previous deployment..."
          
          for attempt in {1..10}; do
            if curl -fsS "https://dev-ops-mid-term.vercel.app/health" | grep -q '"status":"healthy"'; then
              echo "Rollback successful! Previous deployment is healthy."
              exit 0
            fi
          
            echo "Waiting for rollback..."
            sleep 5
          done
          
          echo "Rollback verification failed."
          exit 1

      - name: Commit version update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pyproject.toml uv.lock

          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version [skip ci]"
            git push origin HEAD:main
          fi
